<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dealer Evaluation Frontend</title>
  <style>body{font-family:Arial;margin:20px}select,button{padding:8px;margin:4px}</style>
</head>
<body>
  <h1>Dealer Evaluation Frontend</h1>

  <!--
    Placeholders below: update these URLs to point to your deployed API endpoints.
    Example replacements:
      const PRODUCT_API = 'http://localhost:5000';
      const DEALER_API = 'http://localhost:3000';
    When you change these placeholders show the changed file for the screenshot `index_urlchanges.png`.
  -->

  <script>
    // Replace these placeholders with your actual deployed API endpoints for the assignment
    const PRODUCT_API = 'https://amal-2611-product-service.example.com'; 
    const DEALER_API = 'https://amal-2611-dealer-service.example.com'; 

    async function fetchProducts(){
      try {
        const r = await fetch(`${PRODUCT_API}/products`);
        if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
        return await r.json();
      } catch (err) {
        console.error('Error fetching products:', err);
        return [];
      }
    }

    async function fetchDealers(productId){
      try {
        const r = await fetch(`${DEALER_API}/dealers?productId=${productId}`);
        if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
        return await r.json();
      } catch (err) {
        console.error('Error fetching dealers:', err);
        return [];
      }
    }

    function el(id){ return document.getElementById(id); }

    async function init(){
      try {
        const products = await fetchProducts();
        const sel = el('products');
        if (products.length === 0) {
          console.warn('No products returned from API');
        }
        products.forEach(p=>{
          const o = document.createElement('option');
          o.value = p.id; o.textContent = `${p.name}`; sel.appendChild(o);
        });
      } catch (err) {
        console.error('Error initializing products:', err);
      }
    }

    async function onSelect(){
      const pid = el('products').value;
      if(!pid) return;
      const dealers = await fetchDealers(pid);
      const out = el('output');
      const priceOut = el('price-output');
      out.innerHTML = '';
      priceOut.innerHTML = '';
      if(dealers.length===0){ out.textContent = 'No dealers found'; return; }
      const ul = document.createElement('ul');
      dealers.forEach(d=>{
        const li = document.createElement('li');
        li.textContent = `${d.dealerName} — $${d.price}`;
        ul.appendChild(li);
      });
      out.appendChild(ul);
      const bestDealer = dealers.reduce((best, current) => current.price < best.price ? current : best, dealers[0]);
      priceOut.textContent = `Price offered by dealer for selected product: ${bestDealer.dealerName} — $${bestDealer.price}`;
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>

  <div>
    <label for="products">Products:</label>
    <select id="products" onchange="onSelect()">
      <option value="">-- select product --</option>
    </select>
  </div>

  <div id="price-output" style="margin-top:16px; font-weight: bold;"></div>
  <div id="output" style="margin-top:20px"></div>

</body>
</html>
